<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JioSTB Live Mirror Gateway</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080b12;
    --card: #121726;
    --border: rgba(255,255,255,.11);
    --btn: #1c243b;
    --btnHover: #26314f;
    --accent: #3b82f6;
    --accent2: #10b981;
    --danger: #ef4444;
    --txt: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--txt); padding: 14px; }
  .layout {
    max-width: 1380px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr; gap: 14px;
    align-items: start;
  }
  @media (min-width: 960px) {
    .layout { grid-template-columns: minmax(0, 1.55fr) 390px; }
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  .hdr { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }
  .sub { font-size: 12px; color: var(--muted); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  button, select {
    background: var(--btn); color: var(--txt); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; touch-action: manipulation; transition: background .12s, transform .06s;
  }
  button:hover { background: var(--btnHover); }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); border-color: transparent; }
  button.active { background: var(--accent2); color: #04130d; border-color: transparent; }
  button.danger { background: rgba(239,68,68,.2); color: #fecaca; border-color: rgba(239,68,68,.4); }
  .screenWrap {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #000; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); user-select: none; cursor: crosshair;
  }
  #tvScreen {
    width: 100%; height: 100%; object-fit: contain; display: block;
    pointer-events: none;
  }
  .overlayHint {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; font-size: 11px; color: rgba(255,255,255,.78);
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .pill {
    background: rgba(8,11,18,.78); border: 1px solid rgba(255,255,255,.16);
    padding: 3px 8px; border-radius: 999px; backdrop-filter: blur(6px);
  }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  input {
    width: 100%; background: #0a0e1a; border: 1px solid var(--border);
    color: var(--txt); padding: 9px 11px; border-radius: 10px; font-size: 13px;
  }
  .dpad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    max-width: 240px; margin: 6px auto;
  }
  .dpad button { height: 48px; font-size: 16px; border-radius: 12px; }
  .okBtn { background: var(--accent); border-color: transparent; }
  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .apps button { padding: 9px 6px; font-size: 12px; }
  code.tiny {
    display: block; margin-top: 6px; padding: 7px 9px; border-radius: 8px;
    background: #0a0e1a; border: 1px solid var(--border); color: #93c5fd;
    font-size: 11px; word-break: break-all; user-select: all;
  }
</style>
</head>
<body>
<div class="layout">
  <div class="card">
    <div class="hdr">
      <div class="title">
        <span class="dot" id="statusDot"></span>
        <span>JioSTB Live Mirror Gateway</span>
      </div>
      <div class="sub" id="netInfo">Checking STB status...</div>
    </div>

    <div class="toolbar">
      <button id="streamBtn" class="active" onclick="toggleStream()">Live Mirror: ON</button>
      <button id="kbdBtn" onclick="toggleKeyboardCapture()">Laptop Keyboard: OFF</button>
      <select id="qualitySel" onchange="restartStreamIfOn()">
        <option value="scale=2&q=65" selected>Fast 960x540 (Low Latency)</option>
        <option value="scale=1&q=70">Full 1920x1080 (Crisp)</option>
        <option value="scale=3&q=55">Eco 640x360 (Cellular/Slow Net)</option>
      </select>
      <button onclick="snapOnce()">Snap Now</button>
    </div>

    <div class="screenWrap" id="screenBox" title="Click to Tap • Drag to Swipe • Scroll Wheel for Up/Down">
      <canvas id="tvCanvas" width="960" height="540" style="width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;"></canvas>
      <div class="overlayHint">
        <span class="pill" id="coordsHint">Connecting mirror stream...</span>
        <span class="pill" id="modeHint">Keyboard Capture: OFF</span>
      </div>
    </div>

    <div class="sub" style="margin-top:8px">
      Hardware 30fps H.264 stream for desktop <code>mpv</code>/<code>ffplay</code>/<code>laptop_mirror_client.py</code>:
      <code class="tiny" id="h264Url">Set API token to reveal stream URL</code>
    </div>
  </div>

  <div class="stack">
    <div class="card">
      <div class="sub" style="margin-bottom:6px">API Token (stored in browser)</div>
      <div class="row">
        <input id="tok" type="password" placeholder="API token">
        <button class="primary" style="flex:0 0 auto" onclick="saveTok()">Connect</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <button class="danger" onclick="k(26)">Power</button>
        <button onclick="k(3)">Home</button>
        <button onclick="k(4)">Back</button>
        <button onclick="k(82)">Menu</button>
      </div>
      <div class="dpad">
        <div></div><button onclick="k(19)">▲</button><div></div>
        <button onclick="k(21)">◀</button><button class="okBtn" onclick="k(23)">OK</button><button onclick="k(22)">▶</button>
        <div></div><button onclick="k(20)">▼</button><div></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="k(25)">Vol -</button>
        <button onclick="k(164)">Mute</button>
        <button onclick="k(24)">Vol +</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="k(89)">Rew</button>
        <button onclick="k(85)">Play/Pause</button>
        <button onclick="k(90)">FF</button>
      </div>
    </div>

    <div class="card">
      <div class="sub" style="margin-bottom:6px">Send Text to TV Focused Box</div>
      <div class="row">
        <input id="txt" placeholder="Type text..." onkeydown="if(event.key==='Enter')sendTxt()">
        <button class="primary" style="flex:0 0 auto" onclick="sendTxt()">Type</button>
        <button style="flex:0 0 auto" onclick="k(66)">Enter</button>
      </div>
    </div>

    <div class="card">
      <div class="sub" style="margin-bottom:8px">Quick Launch</div>
      <div class="apps">
        <button onclick="launch('com.abhinav.cinejoy')">Cinejoy</button>
        <button onclick="launch('org.smarttube.stable')">SmartTube</button>
        <button onclick="launch('app.netmirror.newtv')">NetMirror</button>
        <button onclick="launch('com.stremio.one')">Stremio</button>
        <button onclick="launch('com.phlox.tvwebbrowser')">TV Bro</button>
        <button onclick="launch('com.aurora.store')">Aurora</button>
        <button onclick="launch('com.tailscale.ipn')">Tailscale</button>
        <button onclick="launch('top.jast.miracastreceiver')">Miracast</button>
        <button onclick="launch('com.futo.fcast.receiver')">FCast</button>
        <button onclick="launch('com.klevico.monet')">Projectivy</button>
        <button onclick="launch('com.abhinav.tvconnect')">TV Connect</button>
        <button onclick="launch('com.android.tv.settings')">Settings</button>
      </div>
    </div>
  </div>
</div>

<script>
const p = new URLSearchParams(location.search);
let token = p.get('token') || localStorage.getItem('tv_api_token') || '';
if (p.get('token')) localStorage.setItem('tv_api_token', token);
document.getElementById('tok').value = token;

let streamOn = true;
let kbdCapture = false;
let dragStart = null;
let dragMoved = false;
let streamAbort = null;
let frameCount = 0;
let fpsWindowStart = performance.now();

const canvas = document.getElementById('tvCanvas');
const ctx2d = canvas.getContext('2d');

async function drawJpegBytes(u8) {
  const blob = new Blob([u8], { type: 'image/jpeg' });
  const bmp = await createImageBitmap(blob);
  if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
    canvas.width = bmp.width;
    canvas.height = bmp.height;
  }
  ctx2d.drawImage(bmp, 0, 0);
  bmp.close();
  frameCount++;
  const now = performance.now();
  if (now - fpsWindowStart >= 1000) {
    const fps = (frameCount * 1000 / (now - fpsWindowStart)).toFixed(1);
    document.getElementById('coordsHint').textContent = `LIVE ${bmp.width}x${bmp.height} • ${fps} fps`;
    frameCount = 0;
    fpsWindowStart = now;
  }
}

function findBytes(buf, b0, b1, start) {
  for (let i = start; i < buf.length - 1; i++) {
    if (buf[i] === b0 && buf[i + 1] === b1) return i;
  }
  return -1;
}

async function startStream() {
  stopStream();
  if (!token) return;
  updateStreamURLHint();
  const q = document.getElementById('qualitySel').value;
  api('/api/start_mirror').catch(() => {});
  const ac = new AbortController();
  streamAbort = ac;
  document.getElementById('coordsHint').textContent = 'Starting hardware mirror...';

  while (streamOn && streamAbort === ac && !ac.signal.aborted) {
    try {
      const resp = await fetch('/api/mirror.mjpeg?' + q + '&token=' + encodeURIComponent(token) + '&ts=' + Date.now(), { signal: ac.signal });
      if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
      const reader = resp.body.getReader();
      let buf = new Uint8Array(0);
      while (streamOn && streamAbort === ac) {
        const { value, done } = await reader.read();
        if (done) break;
        const merged = new Uint8Array(buf.length + value.length);
        merged.set(buf, 0);
        merged.set(value, buf.length);
        buf = merged;
        while (true) {
          const soi = findBytes(buf, 0xff, 0xd8, 0);
          if (soi < 0) {
            if (buf.length > 65536) buf = buf.slice(buf.length - 4);
            break;
          }
          const eoi = findBytes(buf, 0xff, 0xd9, soi + 2);
          if (eoi < 0) {
            if (soi > 0) buf = buf.slice(soi);
            break;
          }
          const jpg = buf.slice(soi, eoi + 2);
          buf = buf.slice(eoi + 2);
          await drawJpegBytes(jpg);
        }
      }
    } catch (e) {
      if (ac.signal.aborted || !streamOn) break;
      document.getElementById('coordsHint').textContent = 'Reconnecting mirror...';
      try {
        const r = await fetch('/api/screen.jpg?' + q + '&token=' + encodeURIComponent(token) + '&ts=' + Date.now(), { signal: ac.signal });
        if (r.ok) await drawJpegBytes(new Uint8Array(await r.arrayBuffer()));
      } catch (_) {}
      await new Promise(r => setTimeout(r, 400));
    }
  }
}

function stopStream() {
  if (streamAbort) {
    streamAbort.abort();
    streamAbort = null;
  }
}

async function snapOnce() {
  if (!token) return;
  const q = document.getElementById('qualitySel').value;
  const r = await fetch('/api/screen.jpg?' + q + '&token=' + encodeURIComponent(token) + '&ts=' + Date.now());
  if (r.ok) await drawJpegBytes(new Uint8Array(await r.arrayBuffer()));
}

function toggleStream() {
  streamOn = !streamOn;
  const btn = document.getElementById('streamBtn');
  btn.textContent = streamOn ? 'Live Mirror: ON' : 'Live Mirror: OFF';
  btn.classList.toggle('active', streamOn);
  if (streamOn) startStream();
  else stopStream();
}

function restartStreamIfOn() {
  if (streamOn) startStream();
}

function toggleKeyboardCapture() {
  kbdCapture = !kbdCapture;
  const btn = document.getElementById('kbdBtn');
  btn.textContent = kbdCapture ? 'Laptop Keyboard: ON' : 'Laptop Keyboard: OFF';
  btn.classList.toggle('active', kbdCapture);
  document.getElementById('modeHint').textContent = kbdCapture
    ? 'Keyboard Capture: ON (Esc=Back, Arrows=D-Pad, Type directly)'
    : 'Keyboard Capture: OFF';
  if (document.activeElement) document.activeElement.blur();
}

function boxToTV(ev) {
  const box = document.getElementById('screenBox').getBoundingClientRect();
  const x = Math.max(0, Math.min(1919, Math.round((ev.clientX - box.left) * 1920 / box.width)));
  const y = Math.max(0, Math.min(1079, Math.round((ev.clientY - box.top) * 1080 / box.height)));
  return { x, y };
}

const screenBox = document.getElementById('screenBox');
screenBox.addEventListener('pointerdown', (ev) => {
  dragStart = { x: ev.clientX, y: ev.clientY, tv: boxToTV(ev) };
  dragMoved = false;
});
screenBox.addEventListener('pointermove', (ev) => {
  if (!dragStart) return;
  if (Math.hypot(ev.clientX - dragStart.x, ev.clientY - dragStart.y) > 16) dragMoved = true;
});
screenBox.addEventListener('pointerup', (ev) => {
  if (!dragStart) return;
  const end = boxToTV(ev);
  if (dragMoved) {
    document.getElementById('coordsHint').textContent = `Swipe (${dragStart.tv.x},${dragStart.tv.y}) -> (${end.x},${end.y})`;
    api(`/api/swipe?x1=${dragStart.tv.x}&y1=${dragStart.tv.y}&x2=${end.x}&y2=${end.y}&ms=240`);
  } else {
    document.getElementById('coordsHint').textContent = `Tap (${end.x}, ${end.y})`;
    api(`/api/tap?x=${end.x}&y=${end.y}`);
  }
  dragStart = null;
});
screenBox.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  if (Math.abs(ev.deltaY) >= Math.abs(ev.deltaX)) k(ev.deltaY > 0 ? 20 : 19);
  else k(ev.deltaX > 0 ? 22 : 21);
}, { passive: false });

const keyMap = {
  ArrowUp: 19, ArrowDown: 20, ArrowLeft: 21, ArrowRight: 22,
  Enter: 23, Escape: 4, Backspace: 67, Home: 3, PageUp: 92, PageDown: 93
};
window.addEventListener('keydown', (ev) => {
  if (!kbdCapture) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (keyMap[ev.key]) {
    ev.preventDefault();
    k(keyMap[ev.key]);
    return;
  }
  if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    ev.preventDefault();
    api('/api/text?q=' + encodeURIComponent(ev.key));
  }
});

async function saveTok() {
  token = document.getElementById('tok').value.trim();
  localStorage.setItem('tv_api_token', token);
  checkHealth();
  if (streamOn) startStream();
}

async function api(path) {
  if (!token) return null;
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + sep + 'token=' + encodeURIComponent(token));
  return r.json();
}

function k(code) { api('/api/key?code=' + code); }
function launch(pkg) { api('/api/launch?pkg=' + encodeURIComponent(pkg)); }

async function sendTxt() {
  const el = document.getElementById('txt');
  const v = el.value;
  if (!v) return;
  await api('/api/text?q=' + encodeURIComponent(v));
  el.value = '';
}

function updateStreamURLHint() {
  const box = document.getElementById('h264Url');
  if (!token) {
    box.textContent = 'Set API token to reveal stream URL';
    return;
  }
  box.textContent = location.origin + '/api/mirror.h264?token=' + token;
}

async function checkHealth() {
  const info = document.getElementById('netInfo');
  const dot = document.getElementById('statusDot');
  try {
    const h = await api('/api/health');
    if (h && h.ok) {
      dot.classList.add('on');
      info.textContent = `${h.model || h.device} • WiFi ${h.wifi_ip || '-'}` + (h.tailscale_ip ? ` • Tailscale ${h.tailscale_ip}` : ' • Tailscale: not signed in yet');
    } else {
      dot.classList.remove('on');
      info.textContent = 'Enter valid API token to connect';
    }
  } catch (e) {
    dot.classList.remove('on');
    info.textContent = 'Disconnected';
  }
}

updateStreamURLHint();
checkHealth();
setInterval(checkHealth, 12000);
if (token) startStream();
</script>
</body>
</html>
