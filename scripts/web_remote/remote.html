<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Abhinav TV Connect API</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --accent:#58a6ff; --green:#95ff50; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:#f0f6fc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:16px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  h2 { margin:4px 0 0; color:var(--accent); font-size:20px; }
  .pill { font-size:12px; color:#8b949e; background:var(--card); border:1px solid var(--border); padding:4px 10px; border-radius:999px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; }
  .grid { display:grid; grid-template-columns:repeat(3,72px); gap:12px; justify-content:center; margin:6px auto; }
  .btn { background:#21262d; border:1px solid var(--border); color:#f0f6fc; border-radius:14px; height:48px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .btn:active { background:var(--accent); color:#0d1117; transform:scale(0.95); }
  .dpad { width:72px; height:72px; border-radius:50%; font-size:22px; }
  .ok { background:#1f6feb; border-color:var(--accent); font-size:18px; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row .btn { flex:1; }
  .apps { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .apps .btn { font-size:12px; height:40px; }
  input { flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#0d1117; color:#fff; font-size:14px; }
  .screen-wrap img { width:100%; border-radius:10px; border:1px solid var(--border); margin-top:10px; cursor:crosshair; }
</style>
</head>
<body>
<h2>Abhinav TV Connect</h2>
<div class="pill" id="stat">Checking API...</div>

<div class="card" id="authCard" style="display:none">
  <div style="font-size:13px;margin-bottom:8px;color:#8b949e">Enter API Token (from /sdcard/tv_connect_token.txt)</div>
  <div class="row" style="margin-top:0">
    <input type="password" id="tok" placeholder="API Token">
    <div class="btn" style="flex:0 0 80px;background:#238636" onclick="saveToken()">Save</div>
  </div>
</div>

<div class="card">
  <div class="grid">
    <div></div><div class="btn dpad" onclick="key(19)">&#9650;</div><div></div>
    <div class="btn dpad" onclick="key(21)">&#9664;</div><div class="btn dpad ok" onclick="key(23)">OK</div><div class="btn dpad" onclick="key(22)">&#9654;</div>
    <div></div><div class="btn dpad" onclick="key(20)">&#9660;</div><div></div>
  </div>
  <div class="row">
    <div class="btn" onclick="key(4)">Back</div>
    <div class="btn" onclick="key(3)">Home</div>
    <div class="btn" onclick="key(85)">Play/Pause</div>
  </div>
  <div class="row">
    <div class="btn" onclick="key(25)">Vol -</div>
    <div class="btn" onclick="key(164)">Mute</div>
    <div class="btn" onclick="key(24)">Vol +</div>
    <div class="btn" onclick="key(26)">Power</div>
  </div>
</div>

<div class="card">
  <div class="row" style="margin-top:0">
    <input type="text" id="txt" placeholder="Type text to TV..." onkeydown="if(event.key==='Enter')sendText()">
    <div class="btn" style="flex:0 0 70px" onclick="sendText()">Send</div>
  </div>
  <div class="row">
    <input type="text" id="url" placeholder="Open URL (https://...)" onkeydown="if(event.key==='Enter')openUrl()">
    <div class="btn" style="flex:0 0 70px" onclick="openUrl()">Open</div>
  </div>
</div>

<div class="card">
  <div class="apps">
    <div class="btn" style="color:var(--green)" onclick="launch('com.abhinav.cinejoy')">Cinejoy</div>
    <div class="btn" onclick="launch('org.smarttube.stable')">SmartTube</div>
    <div class="btn" onclick="launch('app.netmirror.newtv')">NetMirror</div>
    <div class="btn" onclick="launch('com.stremio.one')">Stremio</div>
    <div class="btn" onclick="launch('com.aurora.store')">Aurora Store</div>
    <div class="btn" onclick="launch('top.jast.miracastreceiver')">Miracast</div>
    <div class="btn" onclick="launch('com.futo.fcast.receiver')">FCast</div>
    <div class="btn" onclick="launch('com.tailscale.ipn')">Tailscale</div>
    <div class="btn" onclick="launch('com.klevico.monet')">Home</div>
  </div>
</div>

<div class="card screen-wrap">
  <div class="row" style="margin-top:0">
    <div class="btn" onclick="refreshScreen()">Capture TV Screen (Tap image to click)</div>
    <div class="btn" style="flex:0 0 80px" onclick="changeToken()">Token</div>
  </div>
  <img id="scr" style="display:none" onclick="tapScreen(event)">
</div>

<script>
const qs = new URLSearchParams(location.search);
if (qs.get('token')) localStorage.setItem('tv_api_token', qs.get('token'));
function getToken(){ return localStorage.getItem('tv_api_token') || ''; }
function saveToken(){
  const v = document.getElementById('tok').value.trim();
  if (!v) return;
  localStorage.setItem('tv_api_token', v);
  document.getElementById('authCard').style.display = 'none';
  checkHealth();
}
function changeToken(){ document.getElementById('authCard').style.display = 'block'; }
async function api(path){
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + sep + 'token=' + encodeURIComponent(getToken()));
  if (r.status === 401) { document.getElementById('authCard').style.display = 'block'; throw new Error('401'); }
  return r;
}
async function checkHealth(){
  try {
    const r = await api('/api/health');
    const j = await r.json();
    document.getElementById('stat').textContent = j.ok ? ('Connected: ' + j.model + ' (' + j.wifi_ip + ')') : 'Error';
  } catch(e) {
    document.getElementById('stat').textContent = 'Auth Required';
  }
}
function key(c){ if (navigator.vibrate) navigator.vibrate(25); api('/api/key?code=' + c).catch(()=>{}); }
function launch(p){ api('/api/launch?pkg=' + encodeURIComponent(p)).catch(()=>{}); }
function sendText(){ const el = document.getElementById('txt'); if(!el.value)return; api('/api/text?q='+encodeURIComponent(el.value)).then(()=>el.value='').catch(()=>{}); }
function openUrl(){ const el = document.getElementById('url'); if(!el.value)return; api('/api/open?url='+encodeURIComponent(el.value)).then(()=>el.value='').catch(()=>{}); }
function refreshScreen(){
  const img = document.getElementById('scr');
  img.src = '/api/screen?token=' + encodeURIComponent(getToken()) + '&t=' + Date.now();
  img.style.display = 'block';
}
function tapScreen(ev){
  const img = ev.target, rect = img.getBoundingClientRect();
  const x = Math.round((ev.clientX - rect.left) / rect.width * 1920);
  const y = Math.round((ev.clientY - rect.top) / rect.height * 1080);
  api('/api/tap?x=' + x + '&y=' + y).then(() => setTimeout(refreshScreen, 700)).catch(()=>{});
}
checkHealth();
</script>
</body>
</html>
